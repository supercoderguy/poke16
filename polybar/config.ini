; Polybar for the e16 themes.  Colours, glyph and fonts come from theme.ini,
; a symlink to build/<Theme>/polybar/<Theme>.ini (switch with set-theme.sh).
;   ~/.config/polybar/config.ini -> this file
;   ~/.config/polybar/theme.ini  -> the active theme

include-file = ~/.config/polybar/theme.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
bottom = false
override-redirect = false
enable-ipc = true

; the e16 title bar: its gradient, with the accent stripe along the bottom
background-0 = ${colors.bg-top}
background-1 = ${colors.bg-mid}
background-2 = ${colors.bg-bottom}
foreground = ${colors.fg}
border-bottom-size = 3
border-bottom-color = ${colors.stripe}

padding-left = 1
padding-right = 2
module-margin = 1
separator = " "

font-0 = ${theme.font-text}
font-1 = ${theme.font-title}
font-2 = DejaVu Sans:size=14;3
font-3 = Noto Sans Symbols:size=11;3
font-4 = Noto Sans Symbols 2:size=11;3
font-5 = Adwaita Mono:size=11;2
font-6 = Noto Sans CJK TC:size=10;2

modules-left = emblem title
modules-center = date
modules-right = nowplaying pulseaudio wlan battery kernel cpu memory tray

cursor-click = pointer
cursor-scroll = ns-resize

; ---- left ------------------------------------------------------------------

[module/emblem]
type = custom/text
format = <label>
label = ${theme.glyph}
label-font = 3
label-foreground = ${colors.accent}
label-padding = 1
click-left = rofi -show drun &
click-right = rofi -show window &

[module/title]
type = internal/xwindow
label = %{T2}%title:0:70:…%%{T-}
label-empty = ${theme.name}
label-empty-foreground = ${colors.dim}

; ---- centre ----------------------------------------------------------------

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
date-alt = %A %d %B %Y
time-alt = %H:%M:%S
label = %{T2}%time%%{T-}  %date%
label-foreground = ${colors.fg}

; ---- right -----------------------------------------------------------------

; whatever is playing (Pear/YouTube Music, Firefox, ...) via MPRIS
[module/nowplaying]
type = custom/script
exec = ~/.config/polybar/nowplaying.sh
interval = 2
format-prefix = "♪ "
format-prefix-foreground = ${colors.accent}
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = "🔊 "
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
label-muted = 🔇 muted
label-muted-foreground = ${colors.dim}
click-right = pavucontrol &

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 5
format-connected = <label-connected>
format-connected-prefix = "◉ "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %essid%
format-disconnected = <label-disconnected>
label-disconnected = ○ offline
label-disconnected-foreground = ${colors.dim}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at = 15
poll-interval = 10
format-charging = <label-charging>
format-charging-prefix = "⚡ "
format-charging-prefix-foreground = ${colors.accent}
format-discharging = <label-discharging>
format-discharging-prefix = "▮ "
format-discharging-prefix-foreground = ${colors.accent}
format-full = <label-full>
format-full-prefix = "▮ "
format-full-prefix-foreground = ${colors.accent}
format-low = <label-low>
format-low-prefix = "▯ "
format-low-foreground = ${colors.urgent}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = full
label-low = %percentage%%

; the running kernel (only changes on reboot, so read once a day)
[module/kernel]
type = custom/script
exec = uname -r
interval = 86400
format-prefix = "linux "
format-prefix-foreground = ${colors.dim}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "cpu "
format-prefix-foreground = ${colors.dim}
label = %percentage:2%%
warn-percentage = 90
format-warn-foreground = ${colors.warn}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "mem "
format-prefix-foreground = ${colors.dim}
label = %percentage_used:2%%

[module/tray]
type = internal/tray
tray-spacing = 6
tray-size = 70%
tray-background = ${colors.bg-mid}

[settings]
screenchange-reload = true
pseudo-transparency = false
